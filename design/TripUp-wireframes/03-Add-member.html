<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>03-Add-member · Add someone to the trip</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1F1F}a:hover{color:#000}
</style>
<style>body{background:#FFFFFF}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8F8F8F; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F1F1F; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 34px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #CFCFCF; align-self: center"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Add to Lisbon</h2>
<a href="02-Plan.html" aria-label="Close" style="width: 44px; height: 44px; border: 1px solid #CFCFCF; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="who" style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5C5C5C">Name, phone or email</label>
<input id="who" value="Ren" style="min-height: 48px; border: 2px solid #1F1F1F; border-radius: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1F1F1F; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 1px solid #CFCFCF; border-radius: 12px; background: #F5F5F5">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #E4E4E4; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">RE</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Ren Takahashi</span><span style="font-size: 12px; color: #5C5C5C">From contacts · not on TripUp yet</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.2" aria-label="Selected" role="img"><path d="M5 12l4 4L19 6"></path></svg>
</div>
</div>
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5C5C5C; padding: 0 0 10px 0">Joining for</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #F0F0F0; border-radius: 12px; padding: 4px">
<label style="min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: #5C5C5C"><input type="radio" name="scope" style="margin: 0; accent-color: #1F1F1F">Whole trip</label>
<label style="min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600; background: #FFFFFF; border: 1px solid #CFCFCF; border-radius: 9px"><input type="radio" name="scope" checked="" style="margin: 0; accent-color: #1F1F1F">Specific days</label>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button disabled="" aria-label="Thursday 9, already past" style="min-height: 52px; border: 1px dashed #CFCFCF; border-radius: 26px; background: #FFFFFF; font-family: inherit; color: #8A8A8A; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0"><span style="font-size: 16px; font-weight: 600">9</span><span style="font-size: 11px">Thu</span></button>
<button disabled="" aria-label="Friday 10, already past" style="min-height: 52px; border: 1px dashed #CFCFCF; border-radius: 26px; background: #FFFFFF; font-family: inherit; color: #8A8A8A; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0"><span style="font-size: 16px; font-weight: 600">10</span><span style="font-size: 11px">Fri</span></button>
<button disabled="" aria-label="Saturday 11, already past" style="min-height: 52px; border: 1px dashed #CFCFCF; border-radius: 26px; background: #FFFFFF; font-family: inherit; color: #8A8A8A; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0"><span style="font-size: 16px; font-weight: 600">11</span><span style="font-size: 11px">Sat</span></button>
<button aria-pressed="true" style="min-height: 52px; border: none; border-radius: 26px; background: #1F1F1F; color: #FFFFFF; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0"><span style="font-size: 16px; font-weight: 600">12</span><span style="font-size: 11px">Today</span></button>
</div>
<div style="border: 1px solid #CFCFCF; border-radius: 14px; padding: 4px 12px; display: flex; flex-direction: column">
<div style="font-size: 12px; color: #5C5C5C; padding: 8px 0 4px 0">Plans on Sunday</div>
<label style="min-height: 48px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E4E4E4; font-size: 14px"><input type="checkbox" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: #1F1F1F"><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600">Dinner · 20:30</span><span style="font-size: 12px; color: #5C5C5C">Not decided yet · Ren can vote</span></span></label>
<label style="min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 14px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1F1F1F"><span style="flex: 1">Free time at the house</span></label>
</div>
</fieldset>
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5C5C5C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>
<span style="flex: 1">Ren joins from a link as a guest, no account needed</span>
</div>
<a href="02-Plan.html" style="min-height: 54px; border-radius: 27px; background: #1F1F1F; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Add guest</a>
</div>
</div>
</body>
</html>
